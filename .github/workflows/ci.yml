name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Integration tests truncate every table they touch, so both URLs point at the
  # throwaway database that the Postgres service creates for this job.
  DATABASE_URL: postgresql://vetnex:vetnex@127.0.0.1:55432/vetnex_test
  TEST_DATABASE_URL: postgresql://vetnex:vetnex@127.0.0.1:55432/vetnex_test
  NODE_ENV: test

jobs:
  verify:
    name: Typecheck, tests and API contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: vetnex
          POSTGRES_PASSWORD: vetnex
          POSTGRES_DB: vetnex_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U vetnex -d vetnex_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @vetnex/database exec prisma generate --schema prisma/schema.prisma

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm -r test
        env:
          # The suite reads invitation and reset tokens from the API response because no
          # email provider is configured. Development-only behaviour, forced off when
          # NODE_ENV is production.
          AUTH_DEV_TOKEN_DELIVERY: "true"
          SESSION_COOKIE_SECURE: "false"

      - name: Verify the published OpenAPI document
        run: pnpm openapi:check

      - name: Upload the OpenAPI document
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: docs/openapi.json
          if-no-files-found: error
          retention-days: 30

  e2e:
    name: Browser end-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    # The suite drops, migrates and seeds its own disposable database, and starts the
    # real API and Next.js servers itself. NODE_ENV is development so `next dev` runs
    # as it does locally; the preparation script only ever touches the E2E database.
    env:
      NODE_ENV: development
      DATABASE_URL: postgresql://vetnex:vetnex@127.0.0.1:55432/vetnex_e2e
      TEST_DATABASE_URL: postgresql://vetnex:vetnex@127.0.0.1:55432/vetnex_e2e
      E2E_DATABASE_URL: postgresql://vetnex:vetnex@127.0.0.1:55432/vetnex_e2e

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: vetnex
          POSTGRES_PASSWORD: vetnex
          POSTGRES_DB: vetnex_e2e
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U vetnex -d vetnex_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @vetnex/database exec prisma generate --schema prisma/schema.prisma

      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # Keyed on the Playwright version alone, so unrelated dependency changes do not
      # discard a ~126 MiB browser download.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium with system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      # The browser comes from the cache, but the OS libraries it needs are not cached.
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Browser end-to-end tests
        run: pnpm test:e2e

      # Uploaded on failure too: the report is the only way to see what the browser saw.
      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14

  docs:
    name: Documentation links
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    # The checker is plain Node and reads the git index, so this job installs nothing.
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check documentation links
        run: node scripts/check-doc-links.mjs
